<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=1920, height=1080"/>
<link rel="stylesheet" href="common.css"/>
<style>
#root{background:radial-gradient(1200px 700px at 30% 40%,#12356b 0%,#06122a 70%)}
#grid{position:absolute;inset:0;opacity:.22}
#k{position:absolute;left:140px;top:320px;color:#7dd3fc;font-size:32px;letter-spacing:.3em;opacity:0}
#h{position:absolute;left:140px;top:380px;color:#fff;letter-spacing:-.02em}
#bar{position:absolute;left:146px;top:0;height:8px;width:0;background:linear-gradient(90deg,#38bdf8,#f472b6);border-radius:4px}
#s{position:absolute;left:146px;color:#fde68a;font-size:46px;font-weight:700;opacity:0}
.chip{position:absolute;color:#e0f2fe;font-size:44px;opacity:0;font-family:Georgia,serif;font-style:italic;font-weight:700}
.nosub #s{display:none}
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">
<svg id="grid" width="1920" height="1080"><defs><pattern id="p" width="90" height="90" patternUnits="userSpaceOnUse"><path d="M90 0H0V90" fill="none" stroke="#7dd3fc"/></pattern></defs><rect width="1920" height="1080" fill="url(#p)"/></svg>
<svg width="1920" height="1080" style="position:absolute;left:0;top:0"><path id="cv" d="M1180 860 C1300 260 1440 260 1560 640 S1760 980 1860 220" fill="none" stroke="#f472b6" stroke-width="10" stroke-linecap="round"/><path id="ax" d="M1130 540 H1880 M1180 180 V900" fill="none" stroke="#7dd3fc" stroke-width="3" opacity=".5"/></svg>
<div class="chip" id="c1" style="left:1200px;top:190px"></div><div class="chip" id="c2" style="left:1560px;top:770px"></div>
<div id="k"></div><div id="h" class="t"></div><div id="bar"></div><div id="s" class="t"></div>
</div>
<script src="gsap.min.js"></script><script src="data.js"></script><script src="common.js"></script>
<script>
const tl = gsap.timeline({ paused: true });

document.getElementById('k').textContent = D.kicker || ''; document.getElementById('s').textContent = D.sub || '';
document.getElementById('c1').textContent = SYMS[0]; document.getElementById('c2').textContent = SYMS[3];
const h = document.getElementById('h'); const us = splitUnits(h, D.heading); const fs = fitText(h, 980, 170);
const yTop = 380 + fs * 1.05; document.getElementById('bar').style.top = yTop + 'px'; document.getElementById('s').style.top = (yTop + 34) + 'px';
const cv = document.getElementById('cv'), L = cv.getTotalLength(); gsap.set(cv, { strokeDasharray: L, strokeDashoffset: L });
tl.to(cv, { strokeDashoffset: 0, duration: 2.4, ease: 'power2.inOut' }, 0.1);
tl.to('#k', { opacity: 1, duration: .5 }, 0.3);
tl.fromTo(us, { opacity: 0, y: 90, rotateX: -80 }, { opacity: 1, y: 0, rotateX: 0, duration: .6, ease: 'back.out(1.6)', stagger: ML ? .18 : .05 }, 0.6);
tl.to('#bar', { width: 640, duration: .9, ease: 'power3.out' }, 1.5);
tl.to('#s', { opacity: 1, duration: .6 }, 1.9);
tl.to('.chip', { opacity: .9, duration: .6, stagger: .3 }, 1.4);
tl.to('#root', { opacity: 0, duration: 0.4 }, 4.6);
window.__timelines['main'] = tl; tl.seek(0);
</script></body></html>
