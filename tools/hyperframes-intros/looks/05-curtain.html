<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=1920, height=1080"/>
<link rel="stylesheet" href="common.css"/>
<style>
#root{background:radial-gradient(800px 800px at 50% 45%,#3b2a6b 0%,#0b0718 75%)}
#h{position:absolute;left:0;width:1920px;text-align:center;top:400px;color:#fff;text-shadow:0 6px 40px rgba(250,204,21,.45)}
#s{position:absolute;left:0;width:1920px;text-align:center;color:#facc15;font-size:50px;font-weight:700;opacity:0;letter-spacing:.06em}
#k{position:absolute;left:0;width:1920px;text-align:center;top:310px;color:#c4b5fd;font-size:32px;letter-spacing:.4em;opacity:0}
.p{position:absolute;top:0;width:965px;height:1080px}
#pl{left:0;background:linear-gradient(90deg,#7f1d1d,#b91c1c);box-shadow:20px 0 60px rgba(0,0,0,.6)}
#pr{right:0;background:linear-gradient(270deg,#7f1d1d,#b91c1c);box-shadow:-20px 0 60px rgba(0,0,0,.6)}
.sp{position:absolute;width:10px;height:10px;border-radius:50%;background:#facc15;opacity:0}
.nosub #s{display:none}
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">
<div id="k" class="t"></div><div id="h" class="t"></div><div id="s" class="t"></div><div id="sps"></div><div class="p" id="pl"></div><div class="p" id="pr"></div>
</div>
<script src="gsap.min.js"></script><script src="data.js"></script><script src="common.js"></script>
<script>
const tl = gsap.timeline({ paused: true });

document.getElementById('k').textContent = D.kicker || ''; document.getElementById('s').textContent = D.sub || '';
const h = document.getElementById('h'); h.textContent = D.heading; const fs = fitText(h, 1640, 190);
h.style.top = (470 - fs * .6) + 'px'; document.getElementById('s').style.top = (470 + fs * .65) + 'px';
for (let i = 0; i < 18; i++) { const d = document.createElement('div'); d.className = 'sp'; d.style.left = (300 + R() * 1320) + 'px'; d.style.top = (250 + R() * 560) + 'px'; document.getElementById('sps').appendChild(d); }
tl.to('#pl', { x: -980, duration: 1.3, ease: 'power3.inOut' }, 0.5); tl.to('#pr', { x: 980, duration: 1.3, ease: 'power3.inOut' }, 0.5);
tl.fromTo(h, { scale: .7, opacity: 0 }, { scale: 1, opacity: 1, duration: 1.2, ease: 'back.out(1.4)' }, 0.8);
tl.to('#k', { opacity: 1, duration: .5 }, 1.5); tl.to('#s', { opacity: 1, duration: .6 }, 2);
tl.to('.sp', { opacity: 1, y: -60, duration: 1.2, stagger: .08, yoyo: true, repeat: 1 }, 1.4);
tl.to('#root', { opacity: 0, duration: 0.4 }, 4.6);
window.__timelines['main'] = tl; tl.seek(0);
</script></body></html>
